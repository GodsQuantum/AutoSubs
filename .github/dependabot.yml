version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, rust]
    open-pull-requests-limit: 10
    groups:
      cargo-updates:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    labels: [dependencies, frontend]
    open-pull-requests-limit: 10
    groups:
      frontend-updates:
        applies-to: version-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "typescript"
        # svelte-check 4.7.x requires TS 5/6; TS 7 is already provided separately via @typescript/native for --tsgo.
        versions: ["7.x"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    open-pull-requests-limit: 5
    groups:
      docker-updates:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, github-actions]
    open-pull-requests-limit: 10
    groups:
      actions-updates:
        applies-to: version-updates
        patterns: ["*"]

