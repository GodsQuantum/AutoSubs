name: Bootstrap lockfiles

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-lockfiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Generate lockfiles once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Check whether bootstrap is needed
        id: locks
        shell: bash
        run: |
          if [[ -s Cargo.lock && -s frontend/package-lock.json ]]; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.locks.outputs.needed == 'true'
        with:
          node-version: '24'

      - name: Generate npm lockfile
        if: steps.locks.outputs.needed == 'true'
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install Rust 1.98
        if: steps.locks.outputs.needed == 'true'
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0

      - name: Generate Cargo lockfile
        if: steps.locks.outputs.needed == 'true'
        run: cargo generate-lockfile

      - name: Commit generated lockfiles
        if: steps.locks.outputs.needed == 'true'
        shell: bash
        run: |
          test -s Cargo.lock
          test -s frontend/package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock frontend/package-lock.json
          git commit -m 'chore: add reproducible lockfiles'
          git push origin HEAD:main

