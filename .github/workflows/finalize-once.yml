name: Finalize AutoSubs once

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: autosubs-finalize-once
  cancel-in-progress: false

jobs:
  validate-and-publish-fix:
    name: Validate fixes
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Apply audited corrections
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=None):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old!r}")
              if count == 0:
                  raise SystemExit(f"{path}: pattern not found: {old!r}")
              p.write_text(text.replace(old, new))

          # Frontend typing fix proven by the previous GitHub run.
          Path("frontend/src/lib/pairing.js").write_text("""\
          /** @typedef {{ name: string }} NamedFile */

          const subtitleExtensions = new Set(['srt', 'ass', 'ssa', 'json']);

          /** @param {string} name @returns {string} */
          const ext = (name) => name.includes('.') ? name.split('.').pop()?.toLowerCase() ?? '' : '';

          /** @param {string} name @returns {string} */
          const stem = (name) => name.replace(/\\.[^.]+$/, '');

          /** @param {string} name @returns {string} */
          const lower = (name) => name.toLowerCase();

          /** @param {string} name @returns {boolean} */
          const isInternalStaging = (name) => {
            const value = lower(name);
            return ext(value) === 'partial' || value.includes('.partial-') || value.endsWith('.uploading') || value.endsWith('_words.json');
          };

          /**
           * Pair media candidates with basename-matching subtitle sidecars.
           * @param {NamedFile[]} files
           * @returns {Array<{ video: NamedFile, sidecar: NamedFile | undefined }>}
           */
          export function pairFiles(files) {
            const candidates = files.filter((file) => !isInternalStaging(file.name));
            /** @type {Map<string, NamedFile>} */
            const sidecars = new Map();
            for (const file of candidates) {
              if (subtitleExtensions.has(ext(file.name))) sidecars.set(stem(file.name).toLowerCase(), file);
            }
            return candidates
              .filter((file) => !subtitleExtensions.has(ext(file.name)))
              .map((video) => ({ video, sidecar: sidecars.get(stem(video.name).toLowerCase()) }));
          }
          """)

          # Five exact Rust failures from Actions job 98615769064.
          replace(
              "src/api/media.rs",
              "HeaderMap, HeaderValue, Response, StatusCode, header",
              "HeaderMap, Response, StatusCode, header",
              1,
          )

          replace(
              "src/jobs.rs",
              "Asset, Brand, EncoderKind, FormatKey, Job, JobStatus, Preset, RawWord, SubtitleLine,",
              "Asset, Brand, EncoderKind, Job, JobStatus, Preset, RawWord, SubtitleLine,",
              1,
          )

          replace(
              "src/workflows.rs",
              "use uuid::Uuid;\n",
              "",
              1,
          )

          replace(
              "src/api/settings.rs",
              "let mut models = value",
              "let mut models: Vec<String> = value",
              1,
          )

          replace(
              "src/jobs.rs",
              "let mut published = Vec::new();",
              "let mut published: Vec<PathBuf> = Vec::new();",
              1,
          )

          # HTML/Svelte correctness already proven by warnings.
          replace(
              "frontend/src/lib/views/SettingsView.svelte",
              "<option value={m}/>",
              "<option value={m}></option>",
          )

          replace(
              "frontend/src/lib/components/PathPicker.svelte",
              '<section class="modal" role="dialog" aria-modal="true" aria-label={title || $dictionary.filePicker}>',
              '<div class="modal" role="dialog" aria-modal="true" aria-label={title || $dictionary.filePicker}>',
              1,
          )
          replace(
              "frontend/src/lib/components/PathPicker.svelte",
              "</section>",
              "</div>",
              1,
          )

          # Generic self-hosted example instead of a deployment-specific hostname.
          replace(
              "frontend/src/lib/views/SettingsView.svelte",
              "http://speaches:8005/v1/audio/transcriptions",
              "http://transcriber:8000/v1/audio/transcriptions",
          )

          # Asset MIME hardening:
          # never trust multipart Content-Type supplied by a browser/client.
          replace(
              "src/api/assets.rs",
              'let name = field.file_name().unwrap_or("asset.bin").to_owned(); let mime = field.content_type().unwrap_or("application/octet-stream").to_owned();',
              'let name = field.file_name().unwrap_or("asset.bin").to_owned(); let mime = mime_guess::from_path(&name).first_or_octet_stream().to_string();',
              1,
          )

          replace(
              "src/api/assets.rs",
              '.header(header::CACHE_CONTROL, "private, max-age=3600")',
              '.header(header::CACHE_CONTROL, "private, max-age=3600")\n        .header("X-Content-Type-Options", "nosniff")',
              1,
          )

          # Generalise known infrastructure examples wherever present.
          for path in [
              ".env.example",
              "compose.example.yaml",
              "README.md",
              "README.fr.md",
          ]:
              p = Path(path)
              if not p.exists():
                  continue
              text = p.read_text()
              text = text.replace("Europe/Paris", "UTC")
              text = text.replace("/mnt/NAS_SAL", "/srv/media")
              text = text.replace("/mnt/NAS", "/srv/media")
              text = text.replace("speaches:8005", "transcriber:8000")
              p.write_text(text)

          # --------------------------------------------------
          # Rust fixes proven by strict Clippy v2.
          # --------------------------------------------------

          # regex::Regex verbose mode (?x) treats '#' as a
          # comment introducer. This compact expression needs
          # only case-insensitive mode.
          replace(
              "src/subtitle/segment.rs",
              'r"(?xi)^(?:https?://\\S+',
              'r"(?i)^(?:https?://\\S+',
              1,
          )

          # Give the dynamic-programming memo a semantic name.
          replace(
              "src/subtitle/segment.rs",
              "static ABBREVIATION_RE: OnceLock<Regex> = OnceLock::new();\n",
              "static ABBREVIATION_RE: OnceLock<Regex> = OnceLock::new();\n"
              "\n"
              "type LayoutMemo = "
              "HashMap<(usize, usize), Option<(f64, Vec<usize>)>>;\n",
              1,
          )

          replace(
              "src/subtitle/segment.rs",
              "memo: &mut HashMap<(usize, usize), "
              "Option<(f64, Vec<usize>)>>",
              "memo: &mut LayoutMemo",
              1,
          )

          # build_render_plan is an FFmpeg boundary whose
          # independent immutable inputs are intentionally
          # explicit. Keep the API explicit and document the
          # single local Clippy exception rather than disabling
          # the lint globally.
          replace(
              "src/media/render.rs",
              "pub fn build_render_plan(\n",
              "#[expect(\n"
              "    clippy::too_many_arguments,\n"
              "    reason = "
              "\"render-plan construction keeps independent "
              "FFmpeg resources explicit\"\n"
              ")]\n"
              "pub fn build_render_plan(\n",
              1,
          )

          # --------------------------------------------------
          # Canonical CI must validate direct pushes to main.
          # --------------------------------------------------

          replace(
              ".github/workflows/ci.yml",
              "on:\n"
              "  pull_request:\n"
              "    branches: [main]\n"
              "  workflow_dispatch:\n",
              "on:\n"
              "  push:\n"
              "    branches: [main]\n"
              "  pull_request:\n"
              "    branches: [main]\n"
              "  workflow_dispatch:\n",
              1,
          )

          # --------------------------------------------------
          # Generic public documentation.
          # --------------------------------------------------

          import re

          for path in [
              ".env.example",
              "compose.example.yaml",
              "README.md",
              "README.fr.md",
              "docs/screenshot-queue.svg",
          ]:
              p = Path(path)
              if not p.exists():
                  continue

              value = p.read_text()

              # Deployment-specific NAS conventions -> generic.
              value = re.sub(
                  r"/mnt/NAS(?:_[A-Za-z0-9_.-]+)?",
                  "/srv/media",
                  value,
              )

              value = value.replace(
                  "Europe/Paris",
                  "UTC",
              )

              value = re.sub(
                  r"http://speaches:[0-9]+",
                  "http://transcriber:8000",
                  value,
              )

              value = value.replace(
                  "/home/.../autosubs",
                  "/srv/autosubs",
              )

              value = value.replace(
                  "Existing homelab deployment",
                  "NAS / external media deployment",
              )

              value = value.replace(
                  "Déploiement homelab existant",
                  "Déploiement NAS / stockage externe",
              )

              p.write_text(value)

          PY

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Frontend regression tests
        working-directory: frontend
        run: npm test

      - name: Frontend TypeScript / Svelte validation
        working-directory: frontend
        run: npm run check

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Install Rust 1.98.0
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Canonical format before lint fixes
        run: cargo fmt --all

      - name: Protected-token regex regression
        run: cargo test --locked protected_token_regex_covers_real_world_tokens

      - name: Apply machine-applicable Clippy fixes
        run: >-
          cargo clippy
          --fix
          --locked
          --all-targets
          --all-features
          --allow-dirty
          --allow-staged

      - name: Canonical format after lint fixes
        run: cargo fmt --all

      - name: Verify rustfmt
        run: cargo fmt --all -- --check

      - name: Strict Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --locked --all-features

      - name: Dependency audit
        shell: bash
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file Cargo.lock

      - name: Current-tree privacy and secret scan
        shell: bash
        run: |
          FOUND=0

          scan_regex() {
            PATTERN="$1"
            LABEL="$2"

            if git grep -n -I -E -e "$PATTERN" -- \
              ':!.github/workflows/finalize-once.yml' \
              ':!docs/social-preview.png'
            then
              echo "::error::Forbidden repository trace: $LABEL"
              FOUND=1
            fi
          }

          # Absolute personal home directories.
          scan_regex \
            '/home/[[:alnum:]_.-]+/' \
            'absolute user home path'

          # RFC1918 LAN addresses.
          scan_regex \
            '192\.168\.[0-9]{1,3}\.[0-9]{1,3}' \
            'private IPv4 address'

          scan_regex \
            '10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}' \
            'private IPv4 address'

          scan_regex \
            '172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}' \
            'private IPv4 address'

          # NAS/machine-specific mount naming.
          scan_regex \
            '/mnt/(NAS|nas)[[:alnum:]_.:/-]*' \
            'deployment-specific NAS path'

          # Common private-key formats.
          scan_regex \
            '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' \
            'private key'

          # Common credential/token forms.
          scan_regex \
            '(sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,})' \
            'credential-like token'

          test "$FOUND" -eq 0

      - name: Repository diff safety
        run: git diff --check

      - name: Build runtime container
        run: docker build --pull -t autosubs-final .

      - name: Runtime API / FFmpeg / libass smoke test
        shell: bash
        run: |
          mkdir -p .ci/config .ci/data .ci/fonts .ci/media
          chmod -R a+rwx .ci

          docker run -d --rm --name autosubs-final \
            -v "$PWD/.ci/config:/config" \
            -v "$PWD/.ci/data:/data" \
            -v "$PWD/.ci/fonts:/fonts:ro" \
            -v "$PWD/.ci/media:/media" \
            autosubs-final

          trap 'docker rm -f autosubs-final >/dev/null 2>&1 || true' EXIT

          HEALTH=""
          for _ in $(seq 1 60); do
            HEALTH="$(docker exec autosubs-final curl -fsS http://127.0.0.1:3000/api/v1/health 2>/dev/null || true)"
            case "$HEALTH" in
              *'"status":"ok"'*) break ;;
            esac
            sleep 1
          done

          printf '%s\n' "$HEALTH"
          echo "$HEALTH" | grep -q '"status":"ok"'
          echo "$HEALTH" | grep -q '"ffmpegReady":true'
          echo "$HEALTH" | grep -q '"libass":true'

      - name: Remove one-shot workflow
        run: rm .github/workflows/finalize-once.yml

      - name: Commit validated corrections
        shell: bash
        run: |
          git diff --check

          if git diff --quiet; then
            echo "No source changes to publish."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "fix: complete production validation"
            git push origin HEAD:main
          fi

      - name: Dispatch canonical CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "${{ github.repository }}" --ref main
