name: Finalize AutoSubs once

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: autosubs-finalize-once
  cancel-in-progress: false

jobs:
  finalize:
    name: Validate and publish
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Apply audited source corrections
        run: python3 .github/scripts/finalize_autosubs.py

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Refresh frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit all frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=low

      - name: Frontend regression tests
        working-directory: frontend
        run: npm test

      - name: Zero-warning Svelte and TypeScript validation
        working-directory: frontend
        run: npm run check -- --fail-on-warnings --output machine-verbose

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Install Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
          rustc --version
          cargo --version
          cargo clippy --version
          rustfmt --version

      - name: Canonical Rust format
        run: cargo fmt --all

      - name: Protected-token regex regression
        run: cargo test --locked protected_token_regex_covers_real_world_tokens

      - name: Apply machine-applicable Clippy fixes
        run: >-
          cargo clippy
          --fix
          --locked
          --all-targets
          --all-features
          --allow-dirty
          --allow-staged

      - name: Canonical Rust format after fixes
        run: cargo fmt --all

      - name: Verify rustfmt
        run: cargo fmt --all -- --check

      - name: Strict Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --locked --all-features

      - name: Rust dependency audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file Cargo.lock

      - name: Remove temporary finalization machinery
        run: |
          rm -f .github/workflows/finalize-once.yml
          rm -f .github/scripts/finalize_autosubs.py
          rm -f .github/workflows/sync-lockfiles.yml

      - name: Final-tree privacy and secret scan
        shell: bash
        run: |
          FOUND=0

          scan_regex() {
            PATTERN="$1"
            LABEL="$2"

            if git grep -n -I -E -e "$PATTERN" -- ':!docs/social-preview.png'
            then
              echo "::error::Forbidden repository trace: $LABEL"
              FOUND=1
            fi
          }

          scan_regex \
            '/home/[[:alnum:]_.-]+/' \
            'absolute user home path'

          scan_regex \
            '192\.168\.[0-9]{1,3}\.[0-9]{1,3}' \
            'private IPv4 address'

          scan_regex \
            '10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}' \
            'private IPv4 address'

          scan_regex \
            '172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}' \
            'private IPv4 address'

          scan_regex \
            '/mnt/(NAS|nas)[[:alnum:]_.:/-]*' \
            'deployment-specific NAS path'

          scan_regex \
            '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' \
            'private key'

          scan_regex \
            '(sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,})' \
            'credential-like token'

          test "$FOUND" -eq 0

      - name: Repository diff safety
        run: git diff --check

      - name: Build runtime container
        run: docker build --pull -t autosubs-final .

      - name: Runtime API FFmpeg libass and routing smoke
        shell: bash
        run: |
          mkdir -p .ci/config .ci/data .ci/fonts .ci/media
          chmod -R a+rwx .ci

          docker run -d --rm --name autosubs-final \
            -v "$PWD/.ci/config:/config" \
            -v "$PWD/.ci/data:/data" \
            -v "$PWD/.ci/fonts:/fonts:ro" \
            -v "$PWD/.ci/media:/media" \
            autosubs-final

          trap 'docker rm -f autosubs-final >/dev/null 2>&1 || true' EXIT

          HEALTH=""

          for _ in $(seq 1 60); do
            HEALTH="$(docker exec autosubs-final curl -fsS http://127.0.0.1:3000/api/v1/health 2>/dev/null || true)"
            case "$HEALTH" in
              *'"status":"ok"'*) break ;;
            esac
            sleep 1
          done

          printf '%s\n' "$HEALTH"

          echo "$HEALTH" | grep -q '"status":"ok"'
          echo "$HEALTH" | grep -q '"ffmpegReady":true'
          echo "$HEALTH" | grep -q '"libass":true'

          INDEX_STATUS="$(docker exec autosubs-final sh -lc 'curl -sS -o /tmp/autosubs-index -w "%{http_code}" http://127.0.0.1:3000/')"
          test "$INDEX_STATUS" = "200"
          docker exec autosubs-final grep -qi 'autosubs' /tmp/autosubs-index

          API_404_STATUS="$(docker exec autosubs-final sh -lc 'curl -sS -o /tmp/autosubs-api-404 -w "%{http_code}" http://127.0.0.1:3000/api/v1/definitely-not-a-route')"

          test "$API_404_STATUS" = "404"

          if docker exec autosubs-final grep -qi '<!doctype html' /tmp/autosubs-api-404
          then
            echo "::error::Unknown API route incorrectly fell through to SPA"
            false
          fi

      - name: Commit validated production tree
        shell: bash
        run: |
          git diff --check
          git add -A

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "fix: complete production validation"
          git push origin HEAD:main

      - name: Dispatch canonical CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "${{ github.repository }}" --ref main
