name: Native Windows/macOS server portability

on:
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'frontend/**'
      - 'packaging/native/**'
      - '.github/workflows/native-os.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-server:
    name: '${{ matrix.os }} / API contract'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install exact repo-pinned Rust toolchain
        shell: bash
        run: |
          channel="$(grep -m1 '^channel = ' rust-toolchain.toml | cut -d'"' -f2)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"
      - name: Frontend build
        shell: bash
        run: |
          cd frontend
          npm ci --no-audit
          npm run check
          npm run build
      - name: Install actual FFmpeg/FFprobe runtime for native media tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install ffmpeg --yes --no-progress
          else
            brew install ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -1
      - name: Rust native tests
        shell: bash
        run: |
          cargo test --locked --all-targets
      - name: Native executable build
        shell: bash
        run: |
          cargo build --release --locked
      - name: Real native process + local HTTP API/UI smoke
        shell: bash
        env:
          APP_NAME: autosubs
        run: |
          exe="target/release/$APP_NAME"
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
          python packaging/native/smoke.py --app "$APP_NAME" --binary "$exe"
      - name: Preserve native server binary for packaging pipeline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'autosubs-native-${{ matrix.os }}'
          path: |
            target/release/autosubs
            target/release/autosubs.exe
            frontend/build/**
          if-no-files-found: error
          retention-days: 14

# This is a native Rust/Python/HTTP smoke, not a complete media installer.
# No Windows/macOS FFmpeg/libass bundling, signing or GPU inference
# is certified by this workflow; those are independent delivery gates.
