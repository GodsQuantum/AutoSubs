name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish (vX.Y.Z)
        required: true
        type: string
      replace_unreleased_tag:
        description: Fast-forward an existing tag only when no GitHub Release exists
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Canonical CI
    uses: ./.github/workflows/ci.yml

  version:
    name: Version consistency
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release tag matches package versions
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          EXPECTED="${RELEASE_TAG#v}"
          CARGO_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')"
          FRONTEND_VERSION="$(python3 -c 'import json; print(json.load(open("frontend/package.json"))["version"])')"
          echo "tag=$EXPECTED"
          echo "cargo=$CARGO_VERSION"
          echo "frontend=$FRONTEND_VERSION"
          test "$EXPECTED" = "$CARGO_VERSION"
          test "$EXPECTED" = "$FRONTEND_VERSION"

  build:
    name: Build release ${{ matrix.arch }}
    needs: [validate, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish architecture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          pull: true
          push: true
          tags: ghcr.io/godsquantum/autosubs:${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

  publish:
    name: Publish release manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble release manifest
        id: image
        shell: bash
        run: |
          docker buildx imagetools create \
            --metadata-file /tmp/metadata.json \
            -t ghcr.io/godsquantum/autosubs:${RELEASE_TAG} \
            -t ghcr.io/godsquantum/autosubs:latest \
            ghcr.io/godsquantum/autosubs:${GITHUB_SHA}-amd64 \
            ghcr.io/godsquantum/autosubs:${GITHUB_SHA}-arm64
          DIGEST="$(jq -r '.["containerimage.descriptor"].digest' /tmp/metadata.json)"
          test "${DIGEST#sha256:}" != "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect ghcr.io/godsquantum/autosubs:${RELEASE_TAG}

      - name: Attest published image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/godsquantum/autosubs
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Ensure release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to move its tag."
            exit 1
          fi

          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -n "$TAG_SHA" && "$TAG_SHA" != "$GITHUB_SHA" ]]; then
            if [[ "${{ inputs.replace_unreleased_tag }}" != "true" ]]; then
              echo "::error::Tag $RELEASE_TAG points to $TAG_SHA instead of $GITHUB_SHA. Re-run with replace_unreleased_tag=true only if the existing tag is unreleased."
              exit 1
            fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" \
              -F force=false >/dev/null
            TAG_SHA="$GITHUB_SHA"
          fi

          if [[ -z "$TAG_SHA" ]]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

          VERIFIED_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$VERIFIED_SHA" = "$GITHUB_SHA"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "AutoSubs $RELEASE_TAG" \
            --generate-notes \
            --latest
