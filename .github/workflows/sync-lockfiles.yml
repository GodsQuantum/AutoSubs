name: Sync lockfiles

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-lockfiles-main
  cancel-in-progress: true

jobs:
  sync:
    name: Sync lockfiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'

      - name: Regenerate npm lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0

      - name: Regenerate Cargo lockfile
        run: cargo generate-lockfile

      - name: Validate generated diff
        run: git diff --check

      - name: Commit lockfile changes when required
        run: |
          if [[ -n "$(git status --porcelain -- Cargo.lock frontend/package-lock.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock frontend/package-lock.json
            git commit -m "chore: sync lockfiles"
            git push origin HEAD:main
          fi

      - name: Dispatch CI against final main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
