services:
  autosubs:
    image: ghcr.io/godsquantum/autosubs:latest
    pull_policy: always
    init: true
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"

    ports:
      - "${AUTOSUBS_BIND_HOST:-127.0.0.1}:${AUTOSUBS_HTTP_PORT:-3051}:3000"

    environment:
      TZ: "${TZ:-UTC}"

      AUTOSUBS_CONFIG_DIR: /config
      AUTOSUBS_DATA_DIR: /data
      AUTOSUBS_ALLOWED_ROOTS: /data:/media

      AUTOSUBS_MAX_RENDER_JOBS: "${AUTOSUBS_MAX_RENDER_JOBS:-2}"
      AUTOSUBS_MAX_TRANSCRIPTION_JOBS: "${AUTOSUBS_MAX_TRANSCRIPTION_JOBS:-2}"
      AUTOSUBS_MAX_QUEUED_JOBS: "${AUTOSUBS_MAX_QUEUED_JOBS:-256}"
      AUTOSUBS_TRANSCRIPTION_LANGUAGE: "${AUTOSUBS_TRANSCRIPTION_LANGUAGE:-fr}"

      AUTOSUBS_TRANSCRIPTION_URL: "${AUTOSUBS_TRANSCRIPTION_URL:-}"
      AUTOSUBS_TRANSCRIPTION_MODEL: "${AUTOSUBS_TRANSCRIPTION_MODEL:-}"
      AUTOSUBS_TRANSCRIPTION_API_KEY: "${AUTOSUBS_TRANSCRIPTION_API_KEY:-}"

      AUTOSUBS_LOCAL_TRANSCRIPTION_ENABLED: "${AUTOSUBS_LOCAL_TRANSCRIPTION_ENABLED:-false}"
      AUTOSUBS_LOCAL_TRANSCRIPTION_URL: "${AUTOSUBS_LOCAL_TRANSCRIPTION_URL:-}"
      AUTOSUBS_LOCAL_TRANSCRIPTION_MODEL: "${AUTOSUBS_LOCAL_TRANSCRIPTION_MODEL:-}"
      AUTOSUBS_LOCAL_TRANSCRIPTION_API_KEY: "${AUTOSUBS_LOCAL_TRANSCRIPTION_API_KEY:-}"
      AUTOSUBS_LOCAL_FALLBACK_ENABLED: "${AUTOSUBS_LOCAL_FALLBACK_ENABLED:-true}"

    volumes:
      - ./config:/config
      - ./data:/data
      - ./fonts:/fonts:ro
      - "${MEDIA_PATH:-./media}:/media"

    read_only: true

    tmpfs:
      - /tmp:size=1g,mode=1777

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 1024
    stop_grace_period: 1m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:3000/api/v1/health
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
